# Tier 1 sources -- endpoints from docs/PLAN.md section 2.
#
# `weight`      scales the rule score of every item from this source (rank.py, phase 3).
# `fetch_limit` caps how many items we PULL and STORE per run. Not to be confused with the
#               per-topic `quota` in interests.yaml, which caps how many items REACH the
#               digest. Fetch generously: raw payloads are kept so the ranker can be
#               re-run over history offline (PLAN.md section 4). `null` means unlimited.
# `enabled`     config intent. Distinct from the runtime health record in the `sources`
#               table, which tracks consecutive_failures.
# `kind`        which adapter IMPLEMENTATION serves this source; `name` identifies the
#               source itself. They coincide today because each implementation serves
#               exactly one source -- a second RSS source would declare an existing kind,
#               and that is the moment to rename the implementation. `kind` never says
#               how many endpoints a source has: that is `url` vs `feeds`, normalised by
#               `Source.endpoints`, and adapters iterate rather than ask. An unknown kind
#               is rejected when this file loads, not when the source is fetched.

sources:
  - name: hn
    kind: hn
    # search_by_date, not tags=front_page: this job runs once a day at 07:00, and a
    # front-page snapshot misses anything that peaked at 03:00 and rolled off. The points
    # floor matches interests.yaml hard_rules.min_hn_points.
    # {since_ts} is a unix timestamp the adapter computes at fetch time: now - 48h
    # (adapters/hn.py LOOKBACK_HOURS). Not 24h -- a story posted 30h ago that only crosses
    # 100 points this morning was never inside a 24h window on either run, so slow burners
    # would be missed permanently. Re-seeing yesterday's items is free once phase 2 dedupes
    # on url hash. The adapter finds this placeholder in the parsed query params, so moving
    # the window to a different param here needs no code change.
    # Fallback if the date search ever disappoints:
    #   https://hn.algolia.com/api/v1/search?tags=front_page
    url: "https://hn.algolia.com/api/v1/search_by_date?tags=story&numericFilters=points>100,created_at_i>{since_ts}"
    weight: 1.0
    fetch_limit: 30
    enabled: true

  - name: gh_trending
    kind: gh_trending
    # No official API and never has been; the HTML is stable. Mirror feeds exist
    # (mshibanami/GitHubTrendingRSS) if the scrape turns out to be a maintenance burden.
    url: "https://github.com/trending?since=daily&spoken_language_code=en"
    weight: 1.0
    fetch_limit: 25
    enabled: true

  - name: hf_papers
    kind: hf_papers
    # The curated daily-papers feed -- far better signal than raw new-model listings.
    url: "https://huggingface.co/api/daily_papers"
    weight: 1.1
    fetch_limit: 50
    enabled: true

  - name: ai_blogs
    kind: ai_blogs
    # A bundle: six endpoints sharing one weight, one fetch budget and one health record.
    # Rule is official feed first, community mirror only where no official feed exists.
    #
    # FRESHNESS MEASURED 2026-09-14 (phase 3a gate, scripts/record_fixtures.py probe).
    # The finding that matters: the Olshansk mirror is not uniformly unreliable, it is
    # unreliable PER FEED -- both official feeds were fresh, and three of four mirror feeds
    # were months stale while returning HTTP 200 with well-formed XML. One healthy feed from
    # that mirror tells you nothing about the others, which is why each feed below carries
    # its own `stale_after_days` and the run summary reports STALE. Without it these simply
    # go quiet and nothing says so. Thresholds are cadence-derived: one global number would
    # either cry wolf on the slow feeds or sleep through the fast ones.
    #
    # DROPPED 2026-09-14, all three months stale, all replaced below. Every alternative
    # checked returned 404 (taobojlen/anthropic-rss-feed, official Anthropic/Meta/Mistral
    # RSS), so the replacements come from the same mirror -- hence the staleness warning
    # rather than blind trust. Re-add any of these if it revives:
    #   anthropic_engineering  newest 2026-05-25 (112d)  feed_anthropic_engineering.xml
    #   meta_ai                newest 2026-07-27  (49d)  feed_meta_ai.xml
    #   mistral                newest 2026-05-22 (115d)  feed_mistral.xml
    #
    # Also deliberately not subscribed: anthropic_red (frontier safety research -- real
    # work, but matches no topic in interests.yaml), cohere (enterprise sales posts), xai
    # (stale, 116d), google_ai (overlaps DeepMind), windsurf_changelog (stale, 109d).
    feeds:
      - name: openai_news
        url: "https://openai.com/news/rss.xml"          # official
        stale_after_days: 7      # measured 0d old, 1193 entries -- posts constantly
      - name: deepmind
        url: "https://deepmind.google/blog/rss.xml"     # official
        stale_after_days: 21     # measured 6d old
      - name: anthropic_news
        url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml"
        stale_after_days: 30     # measured 13d old
      # Replacements for the three dropped feeds. Chosen to weight toward ai-coding-agents,
      # the highest-weighted topic in interests.yaml (1.2).
      - name: claude
        url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_claude.xml"
        stale_after_days: 14     # measured 0d old, changelog-like cadence
      - name: anthropic_research
        url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_research.xml"
        stale_after_days: 60     # measured 4d old but only 15 entries total -- low volume
      - name: cursor
        url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_cursor.xml"
        stale_after_days: 45     # measured 4d old, 22 entries -- changelog cadence
    weight: 1.2
    fetch_limit: null
    enabled: true

  - name: arxiv_cs_ai
    kind: arxiv
    # A bundle, despite the name: one adapter serves several categories.
    #
    # VOLUME MEASURED 2026-09-14: cs.AI 270 entries, cs.CL 115, cs.MA 16. Not the ~50/day
    # the plan assumed. Of cs.AI's 270, only 167 are new work -- the rest are `replace` /
    # `replace-cross`, i.e. v2 revisions of papers that may be months old. The adapter keeps
    # `new` and `cross` only; a revision entering the digest as if fresh is exactly the
    # quiet wrongness that makes you stop trusting it.
    #
    # fetch_limit covers everything eligible rather than capping at 50. Fetch generously,
    # select narrowly: an item never stored can never be re-scored when the ranker changes
    # (PLAN.md section 4), and RSS order is announcement order, so a cap would discard ~70%
    # of arXiv essentially at random. Topic quotas in interests.yaml do the narrowing --
    # that is what they are for. Cost is a few hundred KB a day; phase 4's LLM spend is
    # unaffected, since only the rule-ranker's top ~60 ever reach a model.
    # The adapter interleaves categories round-robin so that if this cap ever does bind, it
    # binds fairly rather than letting cs.AI's 270 crush cs.MA's 16.
    feeds:
      - name: cs.AI
        url: "https://rss.arxiv.org/rss/cs.AI"
      - name: cs.CL
        url: "https://rss.arxiv.org/rss/cs.CL"
      - name: cs.MA
        url: "https://rss.arxiv.org/rss/cs.MA"
    weight: 0.7
    fetch_limit: 250
    enabled: true
